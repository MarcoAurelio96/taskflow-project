<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Task</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:,">

    <script>
        // Config para Tailwind via CDN (modo oscuro manual por clase)
        window.tailwind = { config: { darkMode: 'class' } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    
    <header class="flex flex-col items-center text-center p-4 relative z-10"> <!--Aquí va el nombre de la web y sería fijo y visible siempre-->
        <img id="logo" src="assets/LOGOok.png" alt="Logo Next Task">
        <h1>Next Task</h1>
        <p>Diseña y planifica tu vida</p>
        <button id="btnModoOscuro" aria-label="Activar modo oscuro">🌙 Modo oscuro</button>       
    </header>
    
    <div class="contenedor p-4 gap-4">
        <main class="rounded-xl shadow-lg p-4"> <!--Aquí va la lista de tareas con sus acciones-->
            <h2>Lista de tareas:</h2>
            <div>
                <form id="formularioTarea">
                    <label for="inputTarea">Nueva tarea</label>
                    <div class="input-wrapper">
                        <input type="text" id="inputTarea" placeholder="Nueva tarea..." maxlength="100" aria-describedby="contadorCaracteres">
                        <small id="contadorCaracteres">0/100</small> 
                    </div>
                    <label for="prioridadTarea">Prioridad</label>
                    <select id="prioridadTarea">
                        <option value="normal" selected>Normal</option>
                        <option value="importante">Importante</option>
                        <option value="urgente">Urgente</option>
                    </select>
                    <button type="submit">Añadir tarea</button>
                </form>

                <input type="text" id="buscador" placeholder="Buscar tarea...">

                <div id="filtros">
                    <button class="filtro activo" data-filtro="todas">Todas</button>
                    <button class="filtro" data-filtro="pendientes">Pendientes</button>
                    <button class="filtro" data-filtro="completadas">Completadas</button>
                </div>

                <button id="btnMarcarTodas" aria-label="Marcar todas las tareas como completadas">✅ Marcar todas</button>
                <button id="btnBorrarCompletadas" aria-label="Borrar tareas completadas">🗑️ Borrar completadas</button>
                <div id="estadoRed" class="estado-red idle" role="status" aria-live="polite"></div>

                <ul id="listaTareas">
                </ul>
            </div>
        </main>
    
        <aside class="rounded-xl shadow-lg p-4"> <!--Aquí van las estadísticas-->
            <h2>Estadísticas:</h2>

            <div class="stat">
                <div class="stat-label">Completadas</div>
                <div class="stat-number" id="tcompletas">0</div>
            </div>

            <div class="stat">
                <div class="stat-label">Por hacer</div>
                <div class="stat-number" id="tporhacer">0</div>
            </div>

            <div class="stat">
                <div class="stat-label">Totales</div>
                <div class="stat-number" id="ttotales">0</div>
            </div>

            <div class="progreso-container">

                <div class="progreso-label">
                    <span>Progreso</span>
                    <span id="tporcentaje">0%</span>
                </div>

                <div class="progreso-barra">
                    <div class="progreso-relleno" id="progresoBarra" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>
                </div>

            </div>

        </aside>
    </div>

    <footer>
        <p>Next Task — Gestiona tu día, una tarea a la vez.</p>
        <p>Hecho por Marco Aurelio · 2026</p>
    </footer>

    <template id="plantillaTarea">
        <li class="tarea">
        <span class="texto-tarea"></span>
        <button class="btn-eliminar">Eliminar</button>
        </li>
    </template>

    <script type="module" src="app.js"></script>

</body>
</html>
